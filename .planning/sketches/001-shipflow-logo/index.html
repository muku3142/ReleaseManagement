<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 001 · Shipflow logo</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  body { padding-top: 56px; }
  #variant-nav { position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #variant-nav button, .chip { font: 500 13px var(--font); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
  #variant-nav button.active, .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .spacer { flex: 1; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h2 { font-size: 22px; margin: 8px 0 4px; letter-spacing: -.01em; }
  .lead { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 14px; }

  /* the mark: white glyph on a gradient tile */
  .tile { display: inline-grid; place-items: center; border-radius: 28%; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; flex: none; box-shadow: 0 6px 18px -8px var(--brand); }
  .tile svg { width: 62%; height: 62%; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .word { font-weight: 750; letter-spacing: -.03em; line-height: 1; }
  .word .accent { background: linear-gradient(135deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .rounded .word { font-family: var(--font-rounded); font-weight: 800; letter-spacing: -.01em; }

  .sizes { display: flex; align-items: end; gap: 18px; }
  .sizes figure { margin: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .browser-tab { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px 10px 0 0; background: var(--bg); border: 1px solid var(--border); border-bottom: 0; font-size: 12px; }
  .header-mock { display: flex; align-items: center; gap: 22px; padding: 10px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); font-size: 13px; }
  .header-mock nav { display: flex; gap: 14px; color: var(--muted); }
  .header-mock nav b { color: var(--text); font-weight: 600; }
  .login-mock { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 28px 20px; border: 1px solid var(--border); border-radius: 14px; background: radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--brand) 14%, transparent), transparent 60%), var(--surface); }
  .login-mock input { width: 100%; max-width: 260px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 13px var(--font); }
  .login-mock button { width: 100%; max-width: 260px; padding: 10px; border: 0; border-radius: 8px; color: #fff; font: 600 13px var(--font); background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
  .on-dark { background: #0f0f14; color: #f1f0f7; } .on-dark .tag { color: #9b9aab; }
  .on-light { background: #fff; color: #16151d; } .on-light .tag { color: #6b6a7a; }

  #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font: 12px system-ui; background: rgba(0,0,0,.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: .45; transition: opacity .2s; display: flex; gap: 6px; align-items: center; }
  #sketch-tools:hover { opacity: 1; }
  #sketch-tools button { font: 12px system-ui; background: #333; color: #fff; border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="variant-nav">
  <button class="variant-tab" data-v="a">A: Flow chevrons</button>
  <button class="variant-tab" data-v="b">B: Release steps</button>
  <button class="variant-tab active" data-v="c">C: Sail ★ Selected</button>
  <span class="spacer"></span>
  <span style="font-size:12px;color:var(--muted)">Palette</span>
  <button class="chip pal" data-pal="violet">Violet</button>
  <button class="chip pal active" data-pal="indigo">Indigo → Sky</button>
  <button class="chip pal" data-pal="teal">Teal → Mint</button>
  <button class="chip pal" data-pal="coral">Coral → Amber</button>
  <button class="chip" id="theme-btn">Dark</button>
</div>

<main id="stage"></main>

<div id="sketch-tools">
  <span>Viewport</span>
  <button data-w="375">Phone</button><button data-w="768">Tablet</button><button data-w="1120">Desktop</button>
</div>

<script>
const GLYPHS = {
  // A: two forward chevrons, flow and momentum
  a: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l8 8-8 8"/><path d="M17 8l8 8-8 8" opacity=".6"/></svg>',
  // B: three ascending rounded steps, the environment ladder, top step brightest
  b: '<svg viewBox="0 0 32 32" fill="currentColor"><rect x="3" y="20" width="9" height="9" rx="2.5" opacity=".55"/><rect x="11.5" y="11.5" width="9" height="9" rx="2.5" opacity=".8"/><rect x="20" y="3" width="9" height="9" rx="2.5"/></svg>',
  // C: friendly sail boat on a wave, ship + flow
  c: '<svg viewBox="0 0 32 32" fill="currentColor"><path d="M15 3v16H6.5z"/><path d="M17.5 7.5L26 19h-8.5z" opacity=".7"/><path d="M4 22h24l-3.2 5H7.2z"/></svg>'
};
const WORD = {
  a: '<span>Shipflow</span>',
  b: '<span>Ship</span><span class="accent">flow</span>',
  c: '<span>shipflow</span>'
};
const NOTES = {
  a: ['Flow chevrons', 'Two forward chevrons: momentum, shipping, "next". Crisp like Linear; the chevrons read clearly even at 16px.'],
  b: ['Release steps', 'Three rising rounded steps: the environment ladder a release climbs, the app\'s core idea. "flow" picks up the brand gradient.'],
  c: ['Sail', 'A small sail boat: the friendliest and most literal "ship". A rounded lowercase wordmark gives a warm, approachable helper tone.']
};
const PALETTES = {
  violet: ['#6d5bf5', '#a78bfa'],
  indigo: ['#4f46e5', '#38bdf8'],
  teal: ['#0d9488', '#34d399'],
  coral: ['#f43f5e', '#f59e0b']
};
let state = { v: 'c', pal: 'indigo', dark: false };

const tile = (v, px) => `<span class="tile" style="width:${px}px;height:${px}px">${GLYPHS[v]}</span>`;
const lockup = (v, size, tagline) => `
  <div class="lockup ${v === 'c' ? 'rounded' : ''}">
    ${tile(v, Math.round(size * 1.5))}
    <div><div class="word" style="font-size:${size}px">${WORD[v]}</div>${tagline ? '<div class="tag">your product roadmap helper</div>' : ''}</div>
  </div>`;

function render() {
  const v = state.v;
  const [b1, b2] = PALETTES[state.pal];
  document.documentElement.style.setProperty('--brand', b1);
  document.documentElement.style.setProperty('--brand-2', b2);
  document.documentElement.dataset.theme = state.dark ? 'dark' : 'light';
  document.getElementById('stage').innerHTML = `
    <h2>Variant ${v.toUpperCase()}: ${NOTES[v][0]}</h2>
    <p class="lead">${NOTES[v][1]}</p>
    <div class="grid">
      <div class="card on-light"><div class="label">Lockup on light</div>${lockup(v, 30, true)}</div>
      <div class="card on-dark"><div class="label" style="color:#9b9aab">Lockup on dark</div>${lockup(v, 30, true)}</div>
      <div class="card"><div class="label">Favicon / app icon sizes</div>
        <div class="sizes">${[16, 24, 32, 48, 64].map(s => `<figure>${tile(v, s)}<figcaption>${s}px</figcaption></figure>`).join('')}</div>
        <div style="margin-top:18px"><span class="browser-tab">${tile(v, 16)} Shipflow · your product roadmap helper</span></div>
      </div>
    </div>
    <div class="grid" style="margin-top:16px">
      <div class="card" style="grid-column:1/-1"><div class="label">App header</div>
        <div class="header-mock">${lockup(v, 17, false)}
          <nav><b>Dashboard</b><span>Releases</span><span>Roadmap</span><span>Briefings</span><span>Assistant</span><span>Settings</span></nav>
        </div>
      </div>
      <div class="card"><div class="label">Login</div>
        <div class="login-mock">${lockup(v, 26, true)}<input placeholder="Jira email"><input placeholder="API token" type="password"><button>Sign in</button></div>
      </div>
      <div class="card"><div class="label">Mark alone, large</div>
        <div style="display:grid;place-items:center;padding:12px">${tile(v, 120)}</div>
      </div>
    </div>`;
}

document.querySelectorAll('.variant-tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  b.classList.add('active'); state.v = b.dataset.v; render();
});
document.querySelectorAll('.pal').forEach(b => b.onclick = () => {
  document.querySelectorAll('.pal').forEach(t => t.classList.remove('active'));
  b.classList.add('active'); state.pal = b.dataset.pal; render();
});
document.getElementById('theme-btn').onclick = e => {
  state.dark = !state.dark; e.target.textContent = state.dark ? 'Light' : 'Dark'; render();
};
document.querySelectorAll('#sketch-tools [data-w]').forEach(b => b.onclick = () => {
  document.querySelector('main').style.maxWidth = b.dataset.w + 'px';
});
render();
</script>
</body>
</html>
