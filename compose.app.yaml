# Full application stack: the built service plus its database.
#
# Deliberately NOT named compose.yaml. Spring Boot's docker-compose integration
# reads compose.yaml on `mvn spring-boot:run`, so adding an `app` service there
# would make the app try to start a container of itself. compose.yaml stays a
# Postgres-only dev dependency; this file is the run-the-whole-thing stack.
#
#   docker compose -f compose.app.yaml up --build -d
#
# Requires RM_CREDENTIAL_KEY, RM_JWT_SECRET, RAG_ADMIN_KEY and RAG_TOOL_SIGNING_SECRET — see .env.example.

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: releasemgmt
      POSTGRES_USER: releasemgmt
      POSTGRES_PASSWORD: ${RM_DB_PASSWORD:-releasemgmt}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-rag}
    ports:
      # Loopback only, so a desktop SQL client can connect without exposing the database on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory, so the mount
      # goes at /var/lib/postgresql, NOT /var/lib/postgresql/data. Mounting the
      # old path makes the image refuse to start. See docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
      # Init scripts run only on an empty data directory; see docs/docker.md for the one-off on an existing volume.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `app` waits on this, so the JVM never starts against a database that is
      # still initialising.
      test: ["CMD-SHELL", "pg_isready -U releasemgmt -d releasemgmt"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: release-management:0.1.0-SNAPSHOT
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `local` is required, not cosmetic: AuthCookieWriter refuses to start with
      # cookie-secure=false outside this profile, and this stack serves plain
      # HTTP on localhost, where Secure cookies are unreliable.
      # Add stub-jira (RM_PROFILES=local,stub-jira) to sign in without a real Jira
      # site — it accepts exactly dev@example.com / valid-token.
      SPRING_PROFILES_ACTIVE: ${RM_PROFILES:-local}
      RM_DB_URL: jdbc:postgresql://postgres:5432/releasemgmt
      RM_DB_USER: releasemgmt
      RM_DB_PASSWORD: ${RM_DB_PASSWORD:-releasemgmt}
      # No defaults on purpose — compose fails fast rather than booting the
      # service with a predictable encryption key or signing secret.
      RM_CREDENTIAL_KEY: ${RM_CREDENTIAL_KEY:?set RM_CREDENTIAL_KEY, e.g. openssl rand -base64 32}
      RM_CREDENTIAL_KEY_VERSION: ${RM_CREDENTIAL_KEY_VERSION:-1}
      RM_JWT_SECRET: ${RM_JWT_SECRET:?set RM_JWT_SECRET, e.g. openssl rand -base64 32}
      RM_JIRA_DEFAULT_BASE_URL: ${RM_JIRA_DEFAULT_BASE_URL:-https://example.atlassian.net}
      # Assistant is off by default and optional: no `:?` and no depends_on rag-service, so v1 starts without it.
      RM_ASSISTANT_ENABLED: ${RM_ASSISTANT_ENABLED:-false}
      RM_ASSISTANT_BASE_URL: http://rag-service:8081
      RM_ASSISTANT_API_KEY: ${RM_ASSISTANT_API_KEY}
      RM_ASSISTANT_STREAM_DEADLINE: ${RM_ASSISTANT_STREAM_DEADLINE:-PT5M}
      RM_ASSISTANT_NUM_CTX: ${RM_ASSISTANT_NUM_CTX:-4096}
      RM_ASSISTANT_TRANSFORM_DEADLINE: ${RM_ASSISTANT_TRANSFORM_DEADLINE:-PT20M}
      # Claude briefing files, mounted read-only (Phase 17.1)
      RM_BRIEFINGS_DIR: /app/briefings/data
      RM_BRIEFINGS_CONFIG: /app/briefings/config.json
    volumes:
      - ./briefings:/app/briefings:ro
    ports:
      - "${RM_PORT:-9292}:8080"
    restart: unless-stopped

  # Independent of `app`: it only needs Postgres. Uses the host's Ollama (and GPU); no Ollama container.
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    image: rag-service:0.1.0-SNAPSHOT
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAG_DB_URL: jdbc:postgresql://postgres:5432/ragdb
      RAG_DB_USER: rag
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-rag}
      #RAG_ADMIN_KEY: ${RAG_ADMIN_KEY:?set RAG_ADMIN_KEY (at least 32 chars), e.g. openssl rand -base64 32}
      #RAG_TOOL_SIGNING_SECRET: ${RAG_TOOL_SIGNING_SECRET:?set RAG_TOOL_SIGNING_SECRET (at least 32 chars), e.g. openssl rand -base64 32}
      RAG_TOOL_MAX_ROUNDS: ${RAG_TOOL_MAX_ROUNDS:-4}
      RAG_TOOL_RESULT_MAX_CHARS: ${RAG_TOOL_RESULT_MAX_CHARS:-8000}
      RAG_OLLAMA_BASE_URL: ${RAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_ADMIN_KEY: ${RAG_ADMIN_KEY:-d7Dn81Jmg6Z3f+JgbbO8aU6a+Pv1zYk4byTTUe06OOY=}
      RAG_TOOL_SIGNING_SECRET: ${RAG_TOOL_SIGNING_SECRET:?set RAG_TOOL_SIGNING_SECRET (at least 32 chars), e.g. openssl rand -base64 32}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      RAG_CHAT_NUM_CTX: ${RAG_CHAT_NUM_CTX:-4096}
      RAG_CHAT_DEADLINE: ${RAG_CHAT_DEADLINE:-PT120S}
      RAG_CHAT_MAX_IN_FLIGHT_PER_CLIENT: ${RAG_CHAT_MAX_IN_FLIGHT_PER_CLIENT:-1}
    extra_hosts:
      # Linux hosts need this; Docker Desktop already resolves host.docker.internal.
      - "host.docker.internal:host-gateway"
    ports:
      - "${RAG_PORT:-9393}:8081"
    restart: unless-stopped

volumes:
  pgdata:
