spring:
  application:
    name: rag-service
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
rag:
  admin-key: test-admin-key-0123456789-abcdefghijklmnop
  ollama:
    base-url: http://localhost:1
    connect-timeout: PT1S
    read-timeout: PT2S
    health-timeout: PT2S
    batch-size: 32
    document-prefix: "search_document: "
    query-prefix: "search_query: "
  embedding:
    default-model: nomic-embed-text
    allowed-models: nomic-embed-text
  chunking:
    max-chars: 1480
    overlap-chars: 150
  limits:
    max-text-bytes: 1048576
    max-request-bytes: 2097152
    max-title-chars: 300
  search:
    default-k: 10
    max-k: 50
  worker:
    initial-delay: PT1H
    poll-interval: PT2S
    batch-size: 8
    lease: PT10M
    backoff-min: PT1S
    backoff-max: PT5M
  chat:
    model: "qwen3:4b"
    num-ctx: 8192
    num-predict: 768
    temperature: 0.2
    transform-temperature: 0.3
    keep-alive: 30m
    deadline: PT3S
    heartbeat-interval: PT1S
    max-in-flight-per-client: 1
    max-in-flight-global: 4
    retry-after-seconds: 5
    k-default: 5
    k-max: 8
    min-score: 0.55
    question-max-chars: 2000
    history-max-turns: 20
    history-turn-max-chars: 4000
    history-token-budget: 1500
    instruction-max-chars: 2000
    chars-per-token: 3.0
  tools:
    signing-secret: test-tool-signing-secret-0123456789-abcdef
    max-rounds: 4
    max-calls: 4
    max-tools: 5
    definitions-max-chars: 1500
    result-max-chars: 8000
    num-predict: 768
