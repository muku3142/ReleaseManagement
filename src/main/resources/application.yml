spring:
  application:
    name: release-management
  datasource:
    url: ${RM_DB_URL:jdbc:postgresql://localhost:5432/releasemgmt}
    username: ${RM_DB_USER:releasemgmt}
    password: ${RM_DB_PASSWORD:releasemgmt}
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  docker:
    compose:
      enabled: true
      skip:
        in-tests: true
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jira:
    default-base-url: ${RM_JIRA_DEFAULT_BASE_URL:https://example.atlassian.net}
    connect-timeout: PT5S
    read-timeout: PT10S
    search:
      page-size: 100
      max-pages: 50
  template:
    render:
      timeout: PT2S
      max-collection-size: 500
      # WR-05: caps how many renders (including ones a caller already timed out waiting on, since
      # jmustache cannot be interrupted mid-render) can be running at once, bounding the resource
      # a burst of pathological requests can accumulate.
      max-concurrent: 64
    logo:
      max-bytes: 2097152
      max-width: 2000
      max-height: 2000
  credential:
    key: ${RM_CREDENTIAL_KEY}
    key-version: ${RM_CREDENTIAL_KEY_VERSION:1}
  jwt:
    secret: ${RM_JWT_SECRET}
    access-ttl: PT10M
    refresh-ttl: PT30M
    absolute-ttl: PT8H
  security:
    cookie-secure: true
