spring:
  application:
    name: release-management
  datasource:
    url: ${RM_DB_URL:jdbc:postgresql://localhost:5432/releasemgmt}
    username: ${RM_DB_USER:releasemgmt}
    password: ${RM_DB_PASSWORD:releasemgmt}
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  docker:
    compose:
      enabled: true
      skip:
        in-tests: true
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jira:
    default-base-url: ${RM_JIRA_DEFAULT_BASE_URL:https://example.atlassian.net}
    connect-timeout: PT5S
    read-timeout: PT10S
    search:
      page-size: 100
      max-pages: 50
    story-points:
      field-id: ${RM_JIRA_STORY_POINTS_FIELD_ID:}
    changelog:
      max-pages: 20
  ado:
    base-url: https://dev.azure.com
    connect-timeout: PT5S
    read-timeout: PT10S
    max-pages-per-pr: 5
  assistant:
    enabled: ${RM_ASSISTANT_ENABLED:false}
    base-url: ${RM_ASSISTANT_BASE_URL:http://localhost:8081}
    api-key: ${RM_ASSISTANT_API_KEY:}
    embedding-model: nomic-embed-text
    sweep:
      initial-delay: PT10S
      interval: ${RM_ASSISTANT_SWEEP_INTERVAL:PT30M}
    index:
      connect-timeout: PT2S
      read-timeout: PT5S
    chat:
      connect-timeout: PT2S
      # Above rag-service's 120 s per-POST generation deadline.
      read-timeout: PT130S
    max-rounds: 4
    # Below rag-service's rag.tools.result-max-chars (8000).
    tool-result-max-chars: 6000
  enrichment:
    max-concurrent: 6
    deadline: PT45S
    # Kept below app.template.render.max-collection-size (500) so a long commit list can never fail document generation (ADO-02).
    max-commits-per-ticket: 400
  template:
    render:
      timeout: PT2S
      max-collection-size: 500
      # WR-05: caps how many renders (including ones a caller already timed out waiting on, since
      # jmustache cannot be interrupted mid-render) can be running at once, bounding the resource
      # a burst of pathological requests can accumulate.
      max-concurrent: 64
    logo:
      max-bytes: 2097152
      max-width: 2000
      max-height: 2000
  credential:
    key: ${RM_CREDENTIAL_KEY}
    key-version: ${RM_CREDENTIAL_KEY_VERSION:1}
  jwt:
    secret: ${RM_JWT_SECRET}
    access-ttl: PT10M
    refresh-ttl: PT30M
    absolute-ttl: PT8H
  security:
    cookie-secure: true
