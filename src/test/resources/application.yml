spring:
  profiles:
    active: local
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
app:
  jira:
    default-base-url: https://test.atlassian.net
    connect-timeout: PT5S
    read-timeout: PT10S
    search:
      page-size: 100
      max-pages: 50
    changelog:
      max-pages: 20
  ado:
    base-url: https://dev.azure.com
    connect-timeout: PT5S
    read-timeout: PT10S
    max-pages-per-pr: 5
  enrichment:
    max-concurrent: 6
    deadline: PT45S
    # Kept below app.template.render.max-collection-size (500) so a long commit list can never fail document generation (ADO-02).
    max-commits-per-ticket: 400
  template:
    render:
      timeout: PT2S
      max-collection-size: 500
      max-concurrent: 64
    logo:
      max-bytes: 2097152
      max-width: 2000
      max-height: 2000
  credential:
    key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    key-version: 1
  jwt:
    secret: and0LXRlc3Qtc2VjcmV0LTAxMjM0NTY3ODlhYmNkZWY=
    access-ttl: PT10M
    refresh-ttl: PT30M
    absolute-ttl: PT8H
  security:
    cookie-secure: false
